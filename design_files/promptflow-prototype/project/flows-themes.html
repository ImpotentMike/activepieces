  /* ============================================================
     THEME E — MIDNIGHT (MyDS dark mode: blue / teal / magenta on dark)
     Same hue family as Theme B (MyDS), inverted surface system.
     Lighter primary stop is used as the on-dark accent for AA contrast.
     ============================================================ */
  body[data-theme="E"] {
    /* Primary — MyDS blue (shifted slightly brighter for dark legibility) */
    --primary-50:  #EFF6FF;
    --primary-100: #DBEAFE;
    --primary-200: #BFDBFE;
    --primary-300: #93C5FD;
    --primary-400: #60A5FA;
    --primary-500: #3B82F6;
    --primary-600: #2563EB;
    --primary-700: #1D4ED8;
    --primary-800: #1E40AF;
    --primary-900: #1E3A8A;

    /* Secondary — MyDS teal */
    --secondary-50:  #E6F8FA;
    --secondary-100: #C6EFF3;
    --secondary-200: #8DDFE7;
    --secondary-300: #4FCED9;
    --secondary-400: #1FB8C6;
    --secondary-500: #06A0AE;
    --secondary-600: #0A8392;

    --secondary-800: #155164;
    --secondary-900: #163E4E;
    --secondary-950: #082431;

    --tertiary-50:  #FBEAF6;
    --tertiary-100: #F5D0EC;
    --tertiary-200: #EAA1D7;
    --tertiary-300: #DD75C0;
    --tertiary-400: #CC4DA5;
    --tertiary-500: #B12E89;
    --tertiary-600: #8E2070;
    --tertiary-700: #6E1858;
    --tertiary-800: #501141;
    --tertiary-900: #390C2F;
    --tertiary-950: #20061B;

    /* DARK SURFACES — neutrals tinted very slightly cool to sit with blue primary */
    --bg-app:     #0B1220;
    --bg-sidebar: #0F1729;
    --bg-surface: #131B2E;
    --bg-elev:    #1A2238;

    /* Inverted gray ramp so every component that references --gray-* still works. */
    --gray-50:  #1A2238;
    --gray-100: #1F2A44;
    --gray-200: #2A3654;
    --gray-300: #3A4865;
    --gray-400: #6B7894;
    --gray-500: #8693AE;
    --gray-600: #A2AEC8;
    --gray-700: #C5CEE0;
    --gray-800: #D9DEEC;
    --gray-900: #E6EDF8;
    --gray-950: #F2F5FB;

    --border:        #243049;
    --border-strong: #2F3D5A;
    --divider:       #1A2238;

    --text-1: #E6EDF8;
    --text-2: #A2AEC8;
    --text-3: #6B7894;

    /* On dark, use the lighter blue stops as the accent for proper contrast */
    --accent:       var(--primary-400);
    --accent-hover: var(--primary-300);
    --accent-on:    #0B1220;
    --accent-soft:   color-mix(in oklab, var(--primary-400) 16%, #0B1220);
    --accent-soft-2: color-mix(in oklab, var(--primary-400) 28%, #0B1220);
    --accent-ring:   color-mix(in srgb,  var(--primary-400) 40%, transparent);

    --info:      var(--secondary-300);
    --info-soft: color-mix(in oklab, var(--secondary-400) 18%, #0B1220);

    --highlight:      var(--tertiary-300);
    --highlight-soft: color-mix(in oklab, var(--tertiary-400) 18%, #0B1220);

    --success-50: color-mix(in oklab, var(--success-500) 16%, #0B1220);
    --warning-50: color-mix(in oklab, var(--warning-500) 16%, #0B1220);
    --danger-50:  color-mix(in oklab, var(--danger-500)  16%, #0B1220);

    --success-text: #6EE7B7;
    --warning-text: #FCD34D;
    --danger-text:  #FCA5A5;

    --shadow-sm:  0 1px 2px rgba(0,0,0,0.45), 0 1px 1px rgba(0,0,0,0.35);
    --shadow-md:  0 6px 18px rgba(0,0,0,0.55), 0 1px 2px rgba(0,0,0,0.40);
    --shadow-pop: 0 16px 40px rgba(0,0,0,0.65), 0 2px 6px rgba(0,0,0,0.45);
  }

  /* ===== semantic mappings consumed by the app ===== */
  [data-theme] {
    --bg-app: var(--gray-50);
    --bg-sidebar: #ffffff;
    --bg-surface: #ffffff;
    --bg-elev: var(--gray-50);

    --border: var(--gray-200);
    --border-strong: var(--gray-300);
    --divider: var(--gray-100);

    --text-1: var(--gray-950);
    --text-2: var(--gray-600);
    --text-3: var(--gray-500);

    --accent: var(--primary-600);
    --accent-hover: var(--primary-700);
    --accent-soft: var(--primary-50);
    --accent-soft-2: var(--primary-100);
    --accent-on: #ffffff;
    --accent-ring: color-mix(in srgb, var(--primary-500) 35%, transparent);

    --info: var(--secondary-600);
    --info-soft: var(--secondary-50);

    --highlight: var(--tertiary-600);
    --highlight-soft: var(--tertiary-50);

    --success-text: #047857;
    --warning-text: #B45309;
    --danger-text:  #B91C1C;

    --shadow-sm: 0 1px 2px rgba(15,23,42,0.04), 0 1px 1px rgba(15,23,42,0.03);
    --shadow-md: 0 4px 12px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
    --shadow-pop: 0 12px 32px rgba(15,23,42,0.10), 0 2px 6px rgba(15,23,42,0.05);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-app);
    color: var(--text-1);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    transition: background-color 200ms ease;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--accent-soft-2); color: var(--text-1); }
</style>

<body data-theme="A">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* =========================================================
   THEME REGISTRY
   ========================================================= */
const THEMES = [
  { id: 'A', name: 'Activepieces', sub: 'Purple · Teal · Pink',     swatch: ['#6E41E2','#06A0AE','#C42E63'] },
  { id: 'B', name: 'MyDS',          sub: 'Blue · Teal · Magenta',    swatch: ['#2563EB','#06A0AE','#B12E89'] },
  { id: 'C', name: 'Gamuda',        sub: 'Teal · Gold · Coral',      swatch: ['#007A7E','#D29719','#E54A2A'] },
  { id: 'D', name: 'Slate',         sub: 'Slate · Blue · Plum',      swatch: ['#3F4D67','#086CB6','#823BB1'] },
  { id: 'E', name: 'Midnight',      sub: 'MyDS · Dark mode',         swatch: ['#60A5FA','#1FB8C6','#CC4DA5'], dark: true },
];

/* =========================================================
   FAKE DATA — Activepieces flows
   ========================================================= */
const FLOWS = [
  { id:'flow_4f2a', name:'New deal → notify sales', folder:'Sales ops',     trigger:'HubSpot · New deal', steps:6,  schedule:'On event',         lastRun:'2m ago',  status:'running' },
  { id:'flow_8c01', name:'Stripe payouts → ledger', folder:'Finance',       trigger:'Stripe · Payout',    steps:9,  schedule:'On event',         lastRun:'14m ago', status:'success' },
  { id:'flow_a93b', name:'Nightly Trudax sync',     folder:'Internal · Trudax', trigger:'Schedule · Cron', steps:12, schedule:'0 2 * * *',        lastRun:'Yesterday 02:00', status:'success' },
  { id:'flow_2d10', name:'SpatialQ asset ingest',   folder:'Internal · SpatialQ', trigger:'Webhook',      steps:7,  schedule:'On event',         lastRun:'1h ago',  status:'failed' },
  { id:'flow_71fe', name:'Onboard new employee',    folder:'People',        trigger:'Form · Submit',      steps:14, schedule:'On event',         lastRun:'3d ago',  status:'published' },
  { id:'flow_b042', name:'Weekly KPI digest',       folder:'Leadership',    trigger:'Schedule · Cron',    steps:5,  schedule:'0 8 * * MON',      lastRun:'Apr 28',  status:'paused' },
  { id:'flow_e518', name:'Support ticket triage',   folder:'Support',       trigger:'Zendesk · Ticket',   steps:8,  schedule:'On event',         lastRun:'7m ago',  status:'running' },
  { id:'flow_c360', name:'Vendor invoice OCR',      folder:'Finance',       trigger:'Email · Inbound',    steps:11, schedule:'On event',         lastRun:'22m ago', status:'success' },
  { id:'flow_009d', name:'Compliance audit log',    folder:'Risk',          trigger:'Schedule · Cron',    steps:4,  schedule:'@hourly',          lastRun:'12m ago', status:'success' },
  { id:'flow_ff2c', name:'Lead enrichment',         folder:'Sales ops',     trigger:'Webhook',            steps:6,  schedule:'On event',         lastRun:'34m ago', status:'disabled' },
];

const KPI = [
  { label:'Active flows',  value:'42',     delta:'+3 this week',     tone:'accent' },
  { label:'Runs (24h)',    value:'1,284',  delta:'↑ 12% vs yest.',   tone:'info' },
  { label:'Success rate',  value:'98.6%',  delta:'↑ 0.4 pts',        tone:'success' },
  { label:'Failed (24h)',  value:'17',     delta:'↓ 6 vs yest.',     tone:'danger' },
];

/* =========================================================
   ICONS (lucide via createElement after mount)
   ========================================================= */
function Icon({ name, size = 16, color, style }) {
  const ref = useRef(null);
  useEffect(() => {
    if (window.lucide && ref.current) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      if (color) el.style.color = color;
      ref.current.appendChild(el);
      window.lucide.createIcons({ attrs: { 'stroke-width': 1.6 } });
    }
  }, [name, size, color]);
  return <span ref={ref} style={{ display:'inline-flex', width:size, height:size, ...style }} />;
}

/* =========================================================
   THEME TOGGLE — top-right pill
   ========================================================= */
function ThemeToggle({ theme, setTheme }) {
  const [open, setOpen] = useState(false);
  const current = THEMES.find(t => t.id === theme) || THEMES[0];
  const idx = THEMES.findIndex(t => t.id === theme);
  const next = () => setTheme(THEMES[(idx + 1) % THEMES.length].id);

  return (
    <div style={{ position:'relative' }}>
      <div style={{
        fontSize:10, fontWeight:600, color:'var(--text-3)',
        textTransform:'uppercase', letterSpacing:0.5, padding:'0 4px 6px',
      }}>Theme iteration</div>
      <div style={{
        display:'flex', alignItems:'stretch',
        background:'var(--bg-elev)',
        border:'1px solid var(--border)',
        borderRadius:8,
        overflow:'hidden',
      }}>
        <button onClick={next} style={tt.main} title="Cycle theme">
          <span style={tt.letter}>{current.id}</span>
          <span style={{ display:'flex', flexDirection:'column', alignItems:'flex-start', gap:1, flex:1, minWidth:0 }}>
            <span style={tt.name}>{current.name}</span>
            <span style={{ ...tt.swatches, marginLeft:0, marginTop:2 }}>
              {current.swatch.map((c,i) => (
                <span key={i} style={{
                  width:9, height:9, borderRadius:2.5,
                  background:c,
                  boxShadow:'inset 0 0 0 1px rgba(0,0,0,0.06)',
                }} />
              ))}
            </span>
          </span>
          <Icon name="refresh-cw" size={12} />
        </button>
        <button onClick={() => setOpen(o => !o)} style={tt.expand} title="Pick theme">
          <Icon name={open ? 'chevron-down' : 'chevron-up'} size={13} />
        </button>
      </div>
      {open && (
        <div style={{
          position:'absolute', left:0, right:0, bottom:'calc(100% + 6px)',
          background:'var(--bg-surface)',
          border:'1px solid var(--border)', borderRadius:10,
          boxShadow:'var(--shadow-pop)', padding:6, zIndex:20,
        }}>
          {THEMES.map(t => (
            <button key={t.id} onClick={() => { setTheme(t.id); setOpen(false); }}
              style={{
                display:'flex', alignItems:'center', gap:10, width:'100%',
                padding:'8px 10px', border:'none', borderRadius:6,
                background: t.id === theme ? 'var(--accent-soft)' : 'transparent',
                color:'var(--text-1)', textAlign:'left',
              }}>
              <span style={{ ...tt.letter, width:24, height:24, fontSize:11 }}>{t.id}</span>
              <span style={{ display:'flex', flexDirection:'column', flex:1 }}>
                <span style={{ fontWeight:600, fontSize:13 }}>{t.name}</span>
                <span style={{ color:'var(--text-3)', fontSize:11 }}>{t.sub}</span>
              </span>
              <span style={{ display:'flex', gap:3 }}>
                {t.swatch.map((c,i) => (
                  <span key={i} style={{ width:10, height:10, borderRadius:3, background:c, boxShadow:'inset 0 0 0 1px rgba(0,0,0,0.06)' }} />
                ))}
              </span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}
const tt = {
  main: { display:'flex', alignItems:'center', gap:8, padding:'7px 8px', background:'transparent', border:'none', color:'var(--text-1)', flex:1, minWidth:0 },
  letter: { width:26, height:26, borderRadius:5, background:'var(--accent)', color:'var(--accent-on)', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:700, fontSize:11, flexShrink:0 },
  name: { fontSize:12, fontWeight:600, lineHeight:1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', maxWidth:'100%' },
  sub:  { fontSize:10.5, color:'var(--text-3)', lineHeight:1 },
  swatches: { display:'flex', gap:3 },
  expand: { padding:'0 8px', background:'transparent', border:'none', borderLeft:'1px solid var(--border)', color:'var(--text-2)', display:'flex', alignItems:'center' },
};

/* =========================================================
   SIDEBAR
   Format follows the reference: brand row + hamburger, project
   picker, BUILD section, ADMIN section, Super Admin row, user
   card. The theme iteration toggle is preserved, tucked between
   admin and Super Admin Settings.
   ========================================================= */
function Sidebar({ route, setRoute, theme, setTheme }) {
  const buildItems = [
    { icon:'layout-grid', label:'Dashboard',   key:'overview' },
    { icon:'workflow',    label:'Workflows',   key:'flows' },
    { icon:'zap',         label:'Runs',        key:'runs' },
    { icon:'unplug',      label:'Connections', key:'connections' },
    { icon:'puzzle',      label:'Connectors',  key:'pieces' },
  ];
  const adminItems = [
    { icon:'users',       label:'Team',             key:'team' },
    { icon:'file-text',   label:'Audit Log',        key:'audit' },
    { icon:'settings',    label:'Project Settings', key:'settings' },
  ];

  // Hidden routes still reachable so the rest of the prototype works
  const extraRoutes = [
    { icon:'git-fork',    label:'Builder',  key:'builder' },
    { icon:'compass',     label:'Explore',  key:'explore' },
  ];

  return (
    <aside style={{

function StatusPill({ status }) {
  const config = {
    running:   { dot:'var(--accent)',     bg:'var(--accent-soft)',    fg:'var(--accent-hover)', label:'Running',   pulse:true },
    success:   { dot:'var(--success-500)',bg:'var(--success-50)',     fg:'var(--success-text)',             label:'Succeeded' },
    failed:    { dot:'var(--danger-500)', bg:'var(--danger-50)',      fg:'var(--danger-text)',             label:'Failed' },
    paused:    { dot:'var(--warning-500)',bg:'var(--warning-50)',     fg:'var(--warning-text)',             label:'Paused' },
    published: { dot:'var(--info)',       bg:'var(--info-soft)',      fg:'var(--info)',         label:'Published' },
    disabled:  { dot:'var(--gray-400)',   bg:'var(--gray-100)',       fg:'var(--gray-600)',     label:'Disabled' },
  }[status];
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:6,
      padding:'3px 9px 3px 8px', borderRadius:999,
      background:config.bg, color:config.fg,
      fontSize:11.5, fontWeight:600,
    }}>
      <span style={{
        width:7, height:7, borderRadius:'50%', background:config.dot,
        boxShadow: config.pulse ? `0 0 0 3px ${config.dot}33` : 'none',
        animation: config.pulse ? 'pulse 1.6s ease-in-out infinite' : 'none',
      }} />
      {config.label}
    </span>
  );
}

function KPICard({ label, value, delta, tone }) {
  const toneColor = {
    accent:  'var(--accent)',
    info:    'var(--info)',
    success: '#047857',
    danger:  '#B91C1C',
  }[tone];
  const toneBg = {
    accent:  'var(--accent-soft)',
    info:    'var(--info-soft)',
    success: 'var(--success-50)',
    danger:  'var(--danger-50)',
  }[tone];
  return (
    <div style={{
      background:'var(--bg-surface)', border:'1px solid var(--border)',
      borderRadius:12, padding:16, boxShadow:'var(--shadow-sm)',
      display:'flex', flexDirection:'column', gap:8,

          background:toneBg, color:toneColor,
        }}>{delta}</span>
      </div>
      <div style={{ fontSize:28, fontWeight:700, letterSpacing:-0.4, color:'var(--text-1)' }}>{value}</div>
    </div>
  );
}

    </main>
  );
}

        {/* horizontal split line under router */}
        <div style={{ position:'relative', width:480, height:34 }}>
          <span style={{ position:'absolute', left:'50%', top:0, width:2, height:14, background:'var(--border-strong)', transform:'translateX(-50%)' }} />
          <span style={{ position:'absolute', left:'25%', right:'25%', top:14, height:2, background:'var(--border-strong)' }} />
          <span style={{ position:'absolute', left:'25%', top:14, width:2, height:20, background:'var(--border-strong)' }} />
          <span style={{ position:'absolute', right:'25%', top:14, width:2, height:20, background:'var(--border-strong)' }} />
        </div>

        {/* branch row */}
        <div style={{ display:'flex', gap:32, alignItems:'flex-start' }}>
          <BranchColumn label="site" tone="primary">
            <FlowNode n={BUILDER_NODES[4]} selected={selectedId === 's3a'} onSelect={() => onSelect('s3a')} compact />
            <FlowConnector small />
            <AddStep compact />
          </BranchColumn>
          <BranchColumn label="review" tone="neutral">
            <FlowNode n={BUILDER_NODES[5]} selected={selectedId === 's3b'} onSelect={() => onSelect('s3b')} compact />
            <FlowConnector small />
            <AddStep compact />
          </BranchColumn>
        </div>
      </div>
    </div>
  );
}

const canvasBtn = {
  width:26, height:26, borderRadius:5, border:'none', background:'transparent',
  color:'var(--text-2)', cursor:'pointer',
  display:'inline-flex', alignItems:'center', justifyContent:'center',
};

function tintColors(tint) {
  switch (tint) {
    case 'primary':   return { bg:'var(--primary-100)',   fg:'var(--primary-700)'   };
    case 'secondary': return { bg:'var(--secondary-100)', fg:'var(--secondary-700)' };
    case 'tertiary':  return { bg:'var(--tertiary-100)',  fg:'var(--tertiary-700)'  };
    default:          return { bg:'var(--gray-100)',      fg:'var(--text-2)'        };
  }
}

function FlowNode({ n, selected, onSelect, isTrigger, compact }) {
  const { bg, fg } = tintColors(n.tint);
  const width = compact ? 280 : 360;
  return (
    <button onClick={onSelect} style={{
      width, padding:0,
      background:'var(--bg-surface)',
      border: selected ? '2px solid var(--accent)' : '1px solid var(--border)',
      borderRadius:10, boxShadow: selected ? '0 0 0 4px var(--accent-soft), var(--shadow-sm)' : 'var(--shadow-sm)',
      textAlign:'left', cursor:'pointer', overflow:'hidden',
      transition:'border-color 140ms ease, box-shadow 140ms ease',
    }}>
      {isTrigger && <span style={{ display:'block', height:3, background:'var(--accent)' }} />}
      <span style={{ display:'flex', alignItems:'center', gap:11, padding:'10px 12px' }}>
        <span style={{
          width:34, height:34, borderRadius:7, background:bg, color:fg,
          display:'inline-flex', alignItems:'center', justifyContent:'center',
          flexShrink:0,
        }}><Icon name={n.icon} size={17} /></span>
        <span style={{ flex:1, minWidth:0 }}>
          <span style={{
            display:'inline-flex', alignItems:'center', gap:5, marginBottom:1,
            fontSize:9.5, fontWeight:600, color:'var(--text-3)',
            textTransform:'uppercase', letterSpacing:0.5,
          }}>
            {n.kind === 'trigger' ? <><Icon name="zap" size={9} /> Trigger</> :
             n.kind === 'branch'  ? <><Icon name="git-branch" size={9} /> Router</> :
                                    <span>{n.piece}</span>}
          </span>
          <span style={{ display:'block', fontSize:13, fontWeight:600, color:'var(--text-1)', lineHeight:1.3, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{n.title}</span>
          <span className="mono" style={{ display:'block', fontSize:10.5, color:'var(--text-3)', marginTop:1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{n.action}</span>
        </span>
        <span style={{ display:'inline-flex', flexDirection:'column', gap:3, alignItems:'flex-end', flexShrink:0 }}>
          {selected && <span style={{
            fontSize:9.5, fontWeight:600, color:'var(--accent-hover)',
            padding:'1px 5px', borderRadius:3, background:'var(--accent-soft)',
          }}>editing</span>}
          <Icon name="more-vertical" size={13} color="var(--text-3)" />
        </span>
      </span>
    </button>
  );
}

function FlowConnector({ small }) {
  return (
    <div style={{
      display:'flex', flexDirection:'column', alignItems:'center',
      height: small ? 36 : 44, position:'relative',
    }}>
      <span style={{ flex:1, width:2, background:'var(--border-strong)' }} />
      <button style={{
        position:'absolute', top:'50%', transform:'translateY(-50%)',
        width:22, height:22, borderRadius:'50%',
        background:'var(--bg-surface)', border:'1px dashed var(--border-strong)',
        color:'var(--text-3)', cursor:'pointer',
        display:'inline-flex', alignItems:'center', justifyContent:'center',
      }}><Icon name="plus" size={12} /></button>
    </div>
  );
}

function AddStep({ compact }) {
  return (
    <button style={{
      width: compact ? 280 : 360, padding:'10px 14px',
      background:'transparent', border:'1px dashed var(--border-strong)',
      borderRadius:10, color:'var(--text-3)', fontSize:12.5, fontWeight:500,
      display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6,
      cursor:'pointer',
    }}><Icon name="plus" size={13} /> Add step</button>
  );
}

function BranchColumn({ label, tone, children }) {
  const { bg, fg } = tintColors(tone === 'primary' ? 'primary' : 'neutral');
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
      <span style={{
        padding:'2px 8px', borderRadius:5,
        background:bg, color:fg, fontSize:10, fontWeight:600,
        marginBottom:8, whiteSpace:'nowrap', textTransform:'uppercase', letterSpacing:0.5,
      }}>category = {label}</span>
      {children}
    </div>
  );
}

function BuilderConfigPanel({ node }) {
  const { bg, fg } = tintColors(node.tint);
  return (
    <aside style={{
      width:360, flexShrink:0, height:'100%', overflow:'auto',
      background:'var(--bg-surface)', borderLeft:'1px solid var(--border)',
      display:'flex', flexDirection:'column',
    }}>
      {/* header */}
      <div style={{ padding:'14px 18px 12px', borderBottom:'1px solid var(--divider)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
          <span style={{
            width:30, height:30, borderRadius:7, background:bg, color:fg,
            display:'inline-flex', alignItems:'center', justifyContent:'center', flexShrink:0,
          }}><Icon name={node.icon} size={16} /></span>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:10, fontWeight:600, color:'var(--text-3)', textTransform:'uppercase', letterSpacing:0.4 }}>{node.piece}</div>
            <div style={{ fontSize:14, fontWeight:600, color:'var(--text-1)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{node.title}</div>
          </div>
          <button style={iconBtn}><Icon name="x" size={14} /></button>
        </div>
        <div style={{ display:'flex', gap:6 }}>
          <button style={tabBtn(true)}>Configure</button>
          <button style={tabBtn(false)}>Test</button>
          <button style={tabBtn(false)}>Logs</button>
        </div>
      </div>

      {/* form */}
      <div style={{ padding:'16px 18px', display:'flex', flexDirection:'column', gap:14, flex:1 }}>
        <Field label="Step name">
          <input defaultValue={node.title} style={inputStyle} />
        </Field>
        <Field label="Connection" hint="Used to authenticate this step">
          <div style={{ ...inputStyle, display:'flex', alignItems:'center', gap:8, padding:'6px 8px 6px 10px' }}>
            <span style={{ width:16, height:16, borderRadius:4, background:'var(--secondary-500)' }} />
            <span style={{ flex:1, fontSize:13 }}>claude_prod</span>
            <span style={{ fontSize:10.5, color:'var(--success-500)', display:'inline-flex', alignItems:'center', gap:4, fontWeight:600 }}>
              <span style={{ width:5, height:5, borderRadius:'50%', background:'var(--success-500)' }} />
              Connected
            </span>
            <Icon name="chevron-down" size={13} color="var(--text-3)" />
          </div>
        </Field>
        <Field label="Model">
          <div style={{ ...inputStyle, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'8px 10px' }}>
            <span style={{ fontSize:13 }}>claude-sonnet-4-5</span>
            <Icon name="chevron-down" size={13} color="var(--text-3)" />
          </div>
        </Field>
        <Field label="System prompt">
          <textarea defaultValue={'Classify each asset into one of: site, review, archive. Return a JSON array of {asset_id, category, confidence}.'} style={{ ...inputStyle, fontSize:12.5, lineHeight:1.5, minHeight:84, resize:'vertical' }} />
        </Field>
        <Field label="Input items" hint="Drag fields from earlier steps">
          <div style={{ display:'flex', flexWrap:'wrap', gap:6, padding:'8px', border:'1px solid var(--border)', borderRadius:8, background:'var(--bg-app)' }}>
            <VarChip step="Fetch updated assets" field="items[]" tint="secondary" />
            <VarChip step="Schedule" field="cursor" tint="primary" />
            <span style={{ padding:'2px 8px', borderRadius:5, border:'1px dashed var(--border-strong)', color:'var(--text-3)', fontSize:11.5, cursor:'pointer' }}>+ Add input</span>
          </div>
        </Field>

        <div style={{
          marginTop:8, padding:12, borderRadius:9,
          background:'var(--success-50)', border:'1px solid color-mix(in oklab, var(--success-500) 25%, transparent)',
        }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6 }}>
            <span style={{ fontSize:11.5, fontWeight:600, color:'var(--success-text)', display:'inline-flex', alignItems:'center', gap:5 }}>
              <Icon name="check-circle-2" size={12} /> Last test passed
            </span>
            <span className="mono" style={{ fontSize:10.5, color:'var(--success-text)' }}>1.4s · 24 items</span>
          </div>
          <div className="mono" style={{ fontSize:11.5, color:'var(--text-2)', lineHeight:1.55 }}>
            <span style={{ color:'var(--text-3)' }}>{'→'}</span> 24/24 classified · site=18 review=4 archive=2
          </div>
        </div>
      </div>

      {/* footer */}
      <div style={{
        padding:'12px 18px', borderTop:'1px solid var(--divider)',
        display:'flex', gap:8, background:'var(--bg-surface)',
      }}>
        <button style={{ ...btnSecondary, flex:1, justifyContent:'center' }}>
          <Icon name="play" size={13} /> Run test step
        </button>
        <button style={btnPrimary}>
          <Icon name="check" size={13} /> Save
        </button>
      </div>
    </aside>
  );
}

const inputStyle = {
  width:'100%', padding:'8px 10px', fontSize:13,
  background:'var(--bg-app)', border:'1px solid var(--border)',
  borderRadius:7, color:'var(--text-1)', outline:'none',
  fontFamily:'inherit',
};

function Field({ label, hint, children }) {
  return (
    <label style={{ display:'flex', flexDirection:'column', gap:5 }}>
      <span style={{ fontSize:11.5, fontWeight:600, color:'var(--text-2)' }}>{label}</span>
      {children}
      {hint && <span style={{ fontSize:11, color:'var(--text-3)' }}>{hint}</span>}
    </label>
  );
}

function tabBtn(active) {
  return {
    padding:'5px 10px', fontSize:12, fontWeight: active ? 600 : 500,
    color: active ? 'var(--text-1)' : 'var(--text-3)',
    background: active ? 'var(--bg-elev)' : 'transparent',
    border:'1px solid', borderColor: active ? 'var(--border)' : 'transparent',
    borderRadius:6, cursor:'pointer',
  };
}

function VarChip({ step, field, tint }) {
  const { bg, fg } = tintColors(tint);
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4,
      padding:'2px 7px', borderRadius:5,
      background:bg, color:fg, fontSize:11, fontWeight:500,
    }}>
      <Icon name="braces" size={10} />
      <span style={{ opacity:0.7 }}>{step}.</span>
      <span className="mono" style={{ fontWeight:600 }}>{field}</span>
    </span>
  );
}

/* =========================================================
   APP
   ========================================================= */
function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem('pf-theme') || 'A');
  const [route, setRoute] = useState(() => localStorage.getItem('pf-route') || 'explore');
  useEffect(() => {
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('pf-theme', theme);
  }, [theme]);
  useEffect(() => { localStorage.setItem('pf-route', route); }, [route]);

  return (
    <div style={{ display:'flex', minHeight:'100vh' }}>
      <Sidebar route={route} setRoute={setRoute} theme={theme} setTheme={setTheme} />
      <div style={{ flex:1, display:'flex', flexDirection:'column', minWidth:0 }}>
        {route === 'explore' ? <ExplorePage /> :
         route === 'builder' ? <BuilderPage /> :
         (<><TopBar route={route} /><FlowsPage /></>)}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<style>
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.45; }
}

/* ============================================================
   Per-theme logo recolor (the source PNG is blue; we hue-shift
   it so the wordmark feels native to each iteration)
   ============================================================ */
.pf-logo { transition: filter 220ms ease; }
[data-theme="A"] .pf-logo { filter: hue-rotate(38deg) saturate(1.05); }   /* purple */
[data-theme="B"] .pf-logo { filter: none; }                                /* native blue */
[data-theme="C"] .pf-logo { filter: hue-rotate(-50deg) saturate(0.95); }   /* teal */
[data-theme="D"] .pf-logo { filter: hue-rotate(-10deg) saturate(0.45) brightness(0.9); } /* slate */
[data-theme="E"] .pf-logo { filter: brightness(1.15) saturate(1.1); } /* midnight: native blue, slightly punchier for dark bg */
</style>
</body>
</html>
